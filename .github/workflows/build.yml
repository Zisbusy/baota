name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., v12.0.0_1.0)宝塔版本+构建版本'
        required: true
        default: 'v12.0.0_1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    # 1. 添加写入 Packages 的权限
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
            ${{ runner.os }}-buildx-

    # 2. 登录到 GitHub Container Registry (ghcr.io)
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. 构建并推送 baota:minimal 镜像 (支持 amd64 和 arm64)
    - name: Build and push minimal image
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ghcr.io/${OWNER_LOWER}/baota:minimal \
          -t ghcr.io/${OWNER_LOWER}/baota:latest \
          -t ghcr.io/${OWNER_LOWER}/baota:minimal-${{ github.event.inputs.image_tag }} \
          -f ./dockerfiles/dockerfile.baota . \
          --push || exit 1

    # 4. 构建并推送 baota:lnmp 镜像 (支持 amd64 和 arm64)
    - name: Build and push lnmp image
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t ghcr.io/${OWNER_LOWER}/baota:lnmp \
          -t ghcr.io/${OWNER_LOWER}/baota:lnmp-${{ github.event.inputs.image_tag }} \
          -f ./dockerfiles/dockerfile.baota-lnmp . \
          --push || exit 1
