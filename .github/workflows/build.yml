name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (e.g., v9.6.0_1.0)宝塔版本+构建版本'
        required: true
        default: 'v9.6.0_1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    # 1. 添加写入 Packages 的权限
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
            ${{ runner.os }}-buildx-

    # 2. 登录到 GitHub Container Registry (ghcr.io)
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. 构建 baota:minimal
    - name: Build minimal image
      run: |
        # GHCR 要求镜像名称全小写，使用 github.repository_owner 替代硬编码的命名空间
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker build \
          -t ghcr.io/${OWNER_LOWER}/baota:minimal \
          -t ghcr.io/${OWNER_LOWER}/baota:latest \
          -t ghcr.io/${OWNER_LOWER}/baota:minimal-${{ github.event.inputs.image_tag }} \
          -f ./dockerfiles/dockerfile.baota . || exit 1

    # 验证 baota:minimal 是否存在
    - name: Verify minimal image exists
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        if ! docker image inspect ghcr.io/${OWNER_LOWER}/baota:minimal > /dev/null 2>&1; then
            echo "Error: ghcr.io/${OWNER_LOWER}/baota:minimal does not exist!"
            exit 1
        fi
    
    # 4. 构建 baota:lnmp
    - name: Build lnmp image
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker build \
          -t ghcr.io/${OWNER_LOWER}/baota:lnmp \
          -t ghcr.io/${OWNER_LOWER}/baota:lnmp-${{ github.event.inputs.image_tag }} \
          -f ./dockerfiles/dockerfile.baota-lnmp . || exit 1

    # 验证 baota:lnmp 是否存在
    - name: Verify lnmp image exists
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        if ! docker image inspect ghcr.io/${OWNER_LOWER}/baota:lnmp > /dev/null 2>&1; then
            echo "Error: ghcr.io/${OWNER_LOWER}/baota:lnmp does not exist!"
            exit 1
        fi
           
    # 5. 推送 minimal image 到 GHCR
    - name: Push minimal image to GHCR
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker push ghcr.io/${OWNER_LOWER}/baota:minimal
        docker push ghcr.io/${OWNER_LOWER}/baota:latest
        docker push ghcr.io/${OWNER_LOWER}/baota:minimal-${{ github.event.inputs.image_tag }}

    # 6. 推送 LNMP image 到 GHCR
    - name: Push LNMP image to GHCR
      run: |
        OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker push ghcr.io/${OWNER_LOWER}/baota:lnmp
        docker push ghcr.io/${OWNER_LOWER}/baota:lnmp-${{ github.event.inputs.image_tag }}
